<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keranjang Belanja - Aplominal" />
    <title>Cart - Aplominal</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>

  <body class="flex flex-col min-h-screen bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200 flex items-center justify-between sticky top-0 z-50 px-6 md:px-10 py-4 shadow-sm">
      <a href="../index.html" class="font-black text-2xl tracking-tighter text-gray-900">Aplominal</a>

      <nav class="hidden md:block">
        <ul class="flex gap-8 font-medium text-gray-500">
          <li><a href="../index.html" class="hover:text-gray-900 transition-colors">Home</a></li>
          <li><a href="#" class="hover:text-gray-900 transition-colors">Products</a></li>
        </ul>
      </nav>

      <div class="right-bar flex items-center gap-6">
        <button class="icon-cart flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors relative">
          <img src="../assets/icons/shopping_cart.png" alt="shopping-cart" class="w-6 h-6 object-contain opacity-80" />
          <span class="cart-badge absolute -top-2 -right-2 bg-gray-200 text-gray-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <a href="auth.html" class="hidden md:inline-block px-5 py-2 bg-gray-900 text-white font-medium rounded-md hover:bg-black transition-colors shadow-sm">Login</a>
        <button class="hamburger md:hidden text-2xl text-gray-600">&#9776;</button>
      </div>
    </header>
    <main class="flex-grow px-6 md:px-10 py-8 max-w-7xl mx-auto w-full">
      <h1 class="font-bold text-gray-900 text-3xl mb-8">Shopping Cart</h1>

      <div class="wrapper flex flex-col lg:flex-row gap-12">
        <div id="cart-container" class="flex flex-col lg:w-2/3 w-full"></div>

        <div class="w-full lg:w-1/3">
          <div class="bg-gray-50 rounded-xl p-6 sm:p-8 border border-gray-100 sticky top-24">
            <h2 class="text-lg font-medium text-gray-900 mb-6">Order summary</h2>

            <div class="flex flex-col gap-4 text-sm text-gray-600 border-b border-gray-200 pb-4 mb-4">
              <div class="flex justify-between">
                <p>Subtotal</p>
                <p class="font-medium text-gray-900" id="subTotal">Rp 0</p>
              </div>
              <div class="flex justify-between">
                <p>Shipping estimate</p>
                <p class="font-medium text-gray-900" id="shipping">Rp 0</p>
              </div>
              <div class="flex justify-between">
                <p>Tax estimate</p>
                <p class="font-medium text-gray-900" id="tax">Rp 0</p>
              </div>
            </div>

            <div class="flex justify-between items-center mb-6">
              <p class="text-base font-medium text-gray-900">Order total</p>
              <p id="cart-total" class="text-base font-medium text-gray-900">Rp 0</p>
            </div>

            <button class="w-full bg-gray-900 text-white py-3 px-4 rounded-lg font-medium hover:bg-black transition-colors shadow-md">Checkout</button>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-white border-t border-gray-200 px-6 md:px-10 py-12 mt-auto w-full">
      <div class="footer-top flex flex-col md:flex-row items-center justify-between gap-8 md:gap-4 text-center md:text-left">
        <div class="flex flex-col gap-1">
          <a href="../index.html" class="font-black text-xl tracking-tighter text-gray-900">Aplominal</a>
          <p class="tagline text-sm text-gray-500">aplo minimalistiko</p>
        </div>

        <nav aria-label="Footer Navigation">
          <ul class="flex flex-wrap justify-center gap-6 text-sm font-medium text-gray-500">
            <li><a href="../index.html" class="hover:text-gray-900 transition-colors">Home</a></li>
            <li><a href="#" class="hover:text-gray-900 transition-colors">Products</a></li>
            <li><a href="#" class="hover:text-gray-900 transition-colors">About Us</a></li>
          </ul>
        </nav>

        <div class="social-media flex gap-6 text-gray-400">
          <a href="#" class="hover:text-gray-900 transition-colors">IG</a>
          <a href="#" class="hover:text-gray-900 transition-colors">TK</a>
          <a href="#" class="hover:text-gray-900 transition-colors">IN</a>
          <a href="#" class="hover:text-gray-900 transition-colors">GH</a>
        </div>
      </div>

      <div class="footer-bottom border-t border-gray-100 mt-10 pt-8 w-full text-center">
        <p class="text-sm text-gray-400">© 2026 AploMinimalistiko. All rights reserved.</p>
      </div>
    </footer>
    <script type="module" src="../js/cart-page.js"></script>
  </body>
</html>
