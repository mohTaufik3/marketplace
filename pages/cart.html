<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Keranjang Belanja - Aplominal" />

    <title>Cart</title>
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="bg-gray-200 flex items-center justify-between sticky top-0 z-50 px-10 py-4">
      <a href="/" class="logo">Aplominal</a>
      <nav class="hidden md:block">
        <ul class="flex gap-4">
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
        </ul>
      </nav>
      <div class="right-bar flex items-center gap-4">
        <button class="icon-cart flex items-center gap-1">
          <img src="../assets/icons/shopping_cart.png" alt="sopping-cart" />
          <span class="cart-badge">0</span>
        </button>
        <a href="auth.html" class="btn-auth">Login</a>
        <button class="hamburger md:hidden">&#9776;</button>
      </div>
    </header>
    <!--  Header End-->

    <!-- Main -->
    <main class="px-10 py-8">
      <h1 class="font-bold text-gray-800 text-2xl mb-6">Shopping Cart</h1>
      <div class="wrapper flex gap-8">
        <!-- Kiri { List Items } -->
        <div class="flex basis-1/2">
          <!-- List Item -->
          <div class="card flex items-center gap-6">
            <img src="../assets/images/AIRism.png" alt="AIRism" class="w-32 h-32 bg-gray-200 rounded-lg" />

            <!-- Keterangan Produk -->
            <div class="info flex flex-col gap-5">
              <p class="font-bold text-lg">Nama Produk</p>
              <p class="">Category</p>
              <p>Harga</p>
            </div>

            <!-- Quantity -->
            <div class="quantity">
              <select name="" id="option">
                <option value="1">1</option>
                <option value="1">2</option>
                <option value="1">3</option>
              </select>
            </div>
            <button>x</button>
          </div>
        </div>

        <!-- Kanan { Summary }-->
        <div class="flex flex-col basis-1/2 sticky top-24 justify-center items-center">
          <h2>Order Summary</h2>
          <p>Subtotal</p>
          <p>Total</p>
          <button>Checkout</button>
        </div>
      </div>
    </main>
    <!-- Main End -->

    <!-- Footer -->
    <footer class="bg-gray-300 flex flex-col px-10 py-8">
      <div class="footer-top flex items-center justify-between">
        <a href="/" class="logo">Aplominal</a>
        <p class="tagline">aplo minimalistiko</p>
        <nav aria-label="Footer Navigation">
          <ul class="flex gap-4">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
          </ul>
        </nav>
        <div class="social-media flex gap-4">
          <a href="/">Instagram</a>
          <a href="/">Tiktok</a>
          <a href="/">LinkedIn</a>
          <a href="/">GitHub</a>
        </div>
      </div>

      <div class="footer-bottom border-t border-gray-400 mt-4 pt-4 w-full text-center">
        <p>© 2026 AploMinimalistiko. All rights reserved. Unauthorized use is prohibited.</p>
      </div>
    </footer>
    <!-- Footer End -->

    <script type="module" src="../js/cart-page.js"></script>
  </body>
</html>
