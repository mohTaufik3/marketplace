<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplominal - Temukan fashion simpel dan minimalis pilihanmu" />
    <title>Aplominal</title>

    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body>
    <header class="bg-gray-200 flex items-center justify-between sticky top-0 z-50 px-10 py-4">
      <a href="/" class="logo">Aplominal</a>
      <nav class="hidden md:block">
        <ul class="flex gap-4">
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
        </ul>
      </nav>
      <div class="right-bar flex items-center gap-4">
        <button class="icon-cart flex items-center gap-1">
          <img src="/assets/icons/shopping_cart.png" alt="sopping-cart" />
          <span class="cart-badge">0</span>
        </button>
        <a href="pages/auth.html" class="btn-auth">Login</a>
        <button class="hamburger md:hidden">&#9776;</button>
      </div>
    </header>

    <main class="min-h-screen bg-gradient-to-br from-gray-50 via-white to-slate-50">
      <!-- Hero Section - Gray Theme -->
      <section class="hero flex items-center justify-between px-4 md:px-10 h-[calc(100vh-72px)]">
        <div class="hero-text pl-0 md:pl-10 max-w-md">
          <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-gray-900 leading-tight">Aplominal</h1>
          <h2 class="text-lg md:text-xl text-gray-600 font-light mt-4 mb-8 max-w-md leading-relaxed">Belanja dengan estetika, simpel dan minimalis</h2>
          <button type="button" class="bg-gray-700 hover:bg-gray-800 text-white px-8 py-4 rounded-2xl font-semibold shadow-lg hover:shadow-xl transition-all duration-300">Lihat Produk</button>
        </div>
        <div class="hero-image pr-0 md:pr-10">
          <img src="/assets/images/aplominal.png" alt="AploMinimalistiko" class="w-72 md:w-80 lg:w-96 h-auto object-cover rounded-2xl shadow-xl" />
        </div>
      </section>

      <!-- Featured Products Section -->
      <section class="featured-products px-4 md:px-10 py-20 md:py-24 lg:py-32">
        <!-- Header -->
        <div class="mx-auto max-w-2xl px-4 sm:px-6 lg:max-w-7xl lg:px-8 mb-16 md:mb-20 text-center">
          <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Produk Unggulan</h2>
        </div>

        <!-- Products Grid -->
        <div class="mx-auto max-w-2xl px-4 sm:px-6 lg:max-w-7xl lg:px-8">
          <div id="product-container" class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3 xl:gap-x-8">
            <!-- Products dari JS -->
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-gray-300 flex flex-col px-10 py-8">
      <div class="footer-top flex items-center justify-between">
        <a href="/" class="logo">Aplominal</a>
        <p class="tagline">aplo minimalistiko</p>
        <nav aria-label="Footer Navigation">
          <ul class="flex gap-4">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
          </ul>
        </nav>
        <div class="social-media flex gap-4">
          <a href="/">Instagram</a>
          <a href="/">Tiktok</a>
          <a href="/">LinkedIn</a>
          <a href="/">GitHub</a>
        </div>
      </div>

      <div class="footer-bottom border-t border-gray-400 mt-4 pt-4 w-full text-center">
        <p>© 2026 AploMinimalistiko. All rights reserved. Unauthorized use is prohibited.</p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
