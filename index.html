<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplominal - Temukan fashion simpel dan minimalis pilihanmu" />
    <title>Aplominal</title>

    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body>
    <header class="bg-gray-200 flex items-center justify-between sticky top-0 z-50 px-10 py-4">
      <a href="/" class="logo">Aplominal</a>
      <nav class="hidden md:block">
        <ul class="flex gap-4">
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
        </ul>
      </nav>
      <div class="right-bar flex items-center gap-4">
        <button class="icon-cart flex items-center gap-1">
          <img src="/assets/icons/shopping_cart.png" alt="sopping-cart" />
          <span class="cart-badge">0</span>
        </button>
        <a href="pages/auth.html" class="btn-auth">Login</a>
        <button class="hamburger md:hidden">&#9776;</button>
      </div>
    </header>

    <main>
      <section class="hero flex items-center justify-between px-10 h-[calc(100vh-72px)]">
        <div class="hero-text pl-10 max-w-md">
          <h1 class="text-4xl text-gray-800 font-black">Aplominal</h1>
          <h2 class="text-lg text-gray-500 font-light mt-2">Belanja dengan estetika, simpel dan minimalis</h2>
          <button type="button" class="bg-gray-600 text-white px-6 py-3 rounded-full mt-6">Lihat Produk</button>
        </div>
        <div class="hero-image pr-10">
          <img src="/assets/images/aplominal.png" alt="AploMinimalistiko" class="w-80 h-auto object-cover rounded-2xl" />
        </div>
      </section>
    </main>

    <footer class="bg-gray-300 flex flex-col px-10 py-8">
      <div class="footer-top flex items-center justify-between">
        <a href="/" class="logo">Aplominal</a>
        <p class="tagline">aplo minimalistiko</p>
        <nav aria-label="Footer Navigation">
          <ul class="flex gap-4">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
          </ul>
        </nav>
        <div class="social-media flex gap-4">
          <a href="/">Instagram</a>
          <a href="/">Tiktok</a>
          <a href="/">LinkedIn</a>
          <a href="/">GitHub</a>
        </div>
      </div>

      <div class="footer-bottom border-t border-gray-400 mt-4 pt-4 w-full text-center">
        <p>© 2026 AploMinimalistiko. All rights reserved. Unauthorized use is prohibited.</p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
